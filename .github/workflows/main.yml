name: Build, Test and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }} / ${{ matrix.link_type }}
    strategy:
      fail-fast: false
      matrix:
        # macOS support requires Mach VM / dyld backed accessors; tracked separately.
        os: [windows-latest, ubuntu-latest]
        build_type: [Release, Debug]
        link_type: [static, shared]
    runs-on: ${{ matrix.os }}

    env:
      PROJECT_NAME: bytebinder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Visual Studio environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        shell: bash
        run: |
          if [[ "${{ matrix.link_type }}" == "static" ]]; then
            STATIC_FLAG=ON
            SHARED_FLAG=OFF
          else
            STATIC_FLAG=OFF
            SHARED_FLAG=ON
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -B build -G "Visual Studio 17 2022" -A x64 \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DBYTEBINDER_BUILD_STATIC=$STATIC_FLAG \
              -DBYTEBINDER_BUILD_SHARED=$SHARED_FLAG
          else
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DBYTEBINDER_BUILD_STATIC=$STATIC_FLAG \
              -DBYTEBINDER_BUILD_SHARED=$SHARED_FLAG
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --timeout 60 -C ${{ matrix.build_type }}

      - name: Stage built libraries
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ "${{ matrix.link_type }}" == "shared" ]]; then
              cp "build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.dll" stage/
              if [[ -f "build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.lib" ]]; then
                cp "build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.lib" stage/
              fi
              if [[ -f "build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.pdb" ]]; then
                cp "build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.pdb" stage/
              fi
            else
              cp "build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.lib" stage/
            fi
          else
            if [[ "${{ matrix.link_type }}" == "shared" ]]; then
              cp build/lib/lib${{ env.PROJECT_NAME }}.so* stage/
            else
              cp build/lib/lib${{ env.PROJECT_NAME }}.a stage/
            fi
          fi
          ls -la stage/

      - name: Upload variant artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bytebinder-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.link_type }}
          path: stage/*
          retention-days: 14
          if-no-files-found: error

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBYTEBINDER_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build -j
      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --timeout 60

  cross_arch_syntax_check:
    name: Cross-arch syntax check (aarch64 + armhf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64 crossbuild-essential-armhf
      - name: aarch64 syntax check
        run: aarch64-linux-gnu-g++ -std=c++20 -c src/remote_accessor.cpp -Iinclude -fsyntax-only
      - name: armhf syntax check
        run: arm-linux-gnueabihf-g++ -std=c++20 -c src/remote_accessor.cpp -Iinclude -fsyntax-only

  release:
    name: Publish release bundle
    needs: [build, sanitizers, cross_arch_syntax_check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: bytebinder-*

      - name: Assemble release bundle
        id: bundle
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            RELEASE_KIND="tag"
          else
            VERSION="latest-master-${GITHUB_SHA::7}"
            RELEASE_KIND="rolling"
          fi

          BUNDLE_NAME="bytebinder-${VERSION}"
          BUNDLE_DIR="${BUNDLE_NAME}"
          mkdir -p "${BUNDLE_DIR}/include"
          cp -r include/. "${BUNDLE_DIR}/include/"

          for variant_dir in incoming/bytebinder-*; do
            artifact_name="$(basename "${variant_dir}")"
            os_part="$(echo "${artifact_name}" | cut -d- -f2 | tr '[:upper:]' '[:lower:]')"
            cfg_part="$(echo "${artifact_name}" | cut -d- -f3 | tr '[:upper:]' '[:lower:]')"
            link_part="$(echo "${artifact_name}" | cut -d- -f4)"
            destination="${BUNDLE_DIR}/${os_part}/${cfg_part}/${link_part}"
            mkdir -p "${destination}"
            cp -r "${variant_dir}"/. "${destination}/"
          done

          {
            echo "# bytebinder ${VERSION}"
            echo
            echo "Bundle layout:"
            echo "    include/                       — public headers"
            echo "    <os>/<config>/<link_type>/     — built libraries per variant"
            echo
            echo "Built from commit ${GITHUB_SHA}."
          } > "${BUNDLE_DIR}/README.txt"

          tree -L 4 "${BUNDLE_DIR}" || find "${BUNDLE_DIR}" -maxdepth 4

          ARCHIVE="${BUNDLE_NAME}.zip"
          zip -r "${ARCHIVE}" "${BUNDLE_DIR}"

          {
            echo "VERSION=${VERSION}"
            echo "RELEASE_KIND=${RELEASE_KIND}"
            echo "ARCHIVE_PATH=${ARCHIVE}"
          } >> "${GITHUB_ENV}"

      - name: Publish tagged release
        if: env.RELEASE_KIND == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ env.ARCHIVE_PATH }}

      - name: Publish rolling latest-master release
        if: env.RELEASE_KIND == 'rolling'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-master
          name: Latest master build
          body: |
            Rolling pre-release built from `master` at commit `${{ github.sha }}`.

            The attached zip contains the public headers under `include/` and
            built libraries laid out as `<os>/<config>/<link_type>/`. Replaced
            on every push to `master`. Use a tagged `v*` release for stable
            artifacts.
          draft: false
          prerelease: true
          make_latest: false
          files: ${{ env.ARCHIVE_PATH }}
