name: Build, Test and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }} / ${{ matrix.link_type }}
    strategy:
      fail-fast: false
      matrix:
        # macOS support requires Mach VM / dyld backed accessors; tracked separately.
        os: [windows-latest, ubuntu-latest]
        build_type: [Release, Debug]
        link_type: [static, shared]
    runs-on: ${{ matrix.os }}

    env:
      PROJECT_NAME: bytebinder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Visual Studio environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y ninja-build
          else
            brew install ninja
          fi

      - name: Configure
        shell: bash
        run: |
          if [[ "${{ matrix.link_type }}" == "static" ]]; then
            STATIC_FLAG=ON
            SHARED_FLAG=OFF
          else
            STATIC_FLAG=OFF
            SHARED_FLAG=ON
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -B build -G "Visual Studio 17 2022" -A x64 \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DBYTEBINDER_BUILD_STATIC=$STATIC_FLAG \
              -DBYTEBINDER_BUILD_SHARED=$SHARED_FLAG
          else
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DBYTEBINDER_BUILD_STATIC=$STATIC_FLAG \
              -DBYTEBINDER_BUILD_SHARED=$SHARED_FLAG
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --timeout 60 -C ${{ matrix.build_type }}

      - name: Normalize OS name
        id: normalize_os
        shell: bash
        run: echo "OS_NAME=$(echo ${{ matrix.os }} | sed 's/-latest//')" >> "$GITHUB_ENV"

      - name: Package files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p package/include package/lib
          cp -r include package/
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ "${{ matrix.link_type }}" == "shared" ]]; then
              cp build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.dll package/lib/
              cp build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.lib package/lib/ || true
            else
              cp build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.lib package/lib/
            fi
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ "${{ matrix.link_type }}" == "shared" ]]; then
              cp build/lib/lib${{ env.PROJECT_NAME }}*.dylib package/lib/
            else
              cp build/lib/lib${{ env.PROJECT_NAME }}.a package/lib/
            fi
          else
            if [[ "${{ matrix.link_type }}" == "shared" ]]; then
              cp build/lib/lib${{ env.PROJECT_NAME }}.so* package/lib/
            else
              cp build/lib/lib${{ env.PROJECT_NAME }}.a package/lib/
            fi
          fi

      - name: Archive package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: zip
          path: package
          filename: bytebinder_${{ env.OS_NAME }}_${{ github.ref_name }}_${{ matrix.build_type }}_${{ matrix.link_type }}.zip

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: bytebinder_${{ env.OS_NAME }}_${{ github.ref_name }}_${{ matrix.build_type }}_${{ matrix.link_type }}
          path: bytebinder_${{ env.OS_NAME }}_${{ github.ref_name }}_${{ matrix.build_type }}_${{ matrix.link_type }}.zip

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBYTEBINDER_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build -j
      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --timeout 60

  cross_arch_syntax_check:
    name: Cross-arch syntax check (aarch64 + armhf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64 crossbuild-essential-armhf
      - name: aarch64 syntax check
        run: aarch64-linux-gnu-g++ -std=c++20 -c src/remote_accessor.cpp -Iinclude -fsyntax-only
      - name: armhf syntax check
        run: arm-linux-gnueabihf-g++ -std=c++20 -c src/remote_accessor.cpp -Iinclude -fsyntax-only

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: artifacts/*.zip
