name: Build, Test and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }} / ${{ matrix.link_type }}
    strategy:
      fail-fast: false
      matrix:
        # macOS support requires Mach VM / dyld backed accessors; tracked separately.
        os: [windows-latest, ubuntu-latest]
        build_type: [Release, Debug]
        link_type: [static, shared]
    runs-on: ${{ matrix.os }}

    env:
      PROJECT_NAME: bytebinder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Visual Studio environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        shell: bash
        run: |
          if [[ "${{ matrix.link_type }}" == "static" ]]; then
            STATIC_FLAG=ON
            SHARED_FLAG=OFF
          else
            STATIC_FLAG=OFF
            SHARED_FLAG=ON
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -B build -G "Visual Studio 17 2022" -A x64 \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DBYTEBINDER_BUILD_STATIC=$STATIC_FLAG \
              -DBYTEBINDER_BUILD_SHARED=$SHARED_FLAG
          else
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DBYTEBINDER_BUILD_STATIC=$STATIC_FLAG \
              -DBYTEBINDER_BUILD_SHARED=$SHARED_FLAG
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --timeout 60 -C ${{ matrix.build_type }}

      - name: Resolve release version
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME,,}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "OS_NAME=$(echo ${{ matrix.os }} | sed 's/-latest//' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "BUILD_TYPE_LOWER=$(echo '${{ matrix.build_type }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Package variant zip (include + lib)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="bytebinder-${OS_NAME}-${RELEASE_VERSION}-${BUILD_TYPE_LOWER}-${{ matrix.link_type }}"
          mkdir -p "${STAGE}/include" "${STAGE}/lib"
          cp -r include/. "${STAGE}/include/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ "${{ matrix.link_type }}" == "shared" ]]; then
              cp "build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.dll" "${STAGE}/lib/"
              if [[ -f "build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.lib" ]]; then
                cp "build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.lib" "${STAGE}/lib/"
              fi
              if [[ -f "build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.pdb" ]]; then
                cp "build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.pdb" "${STAGE}/lib/"
              fi
            else
              cp "build/lib/${{ matrix.build_type }}/${{ env.PROJECT_NAME }}.lib" "${STAGE}/lib/"
            fi
          else
            if [[ "${{ matrix.link_type }}" == "shared" ]]; then
              cp build/lib/lib${{ env.PROJECT_NAME }}.so* "${STAGE}/lib/"
            else
              cp build/lib/lib${{ env.PROJECT_NAME }}.a "${STAGE}/lib/"
            fi
          fi
          ZIP_NAME="${STAGE}.zip"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip "${ZIP_NAME}" "${STAGE}" >/dev/null
          else
            zip -r "${ZIP_NAME}" "${STAGE}"
          fi
          echo "ZIP_PATH=${ZIP_NAME}" >> "$GITHUB_ENV"
          ls -la "${ZIP_NAME}"

      - name: Upload variant zip as artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bytebinder-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.link_type }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 14
          if-no-files-found: error

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBYTEBINDER_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build -j
      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --timeout 60

  cross_arch_syntax_check:
    name: Cross-arch syntax check (aarch64 + armhf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64 crossbuild-essential-armhf
      - name: aarch64 syntax check
        run: aarch64-linux-gnu-g++ -std=c++20 -c src/remote_accessor.cpp -Iinclude -fsyntax-only
      - name: armhf syntax check
        run: arm-linux-gnueabihf-g++ -std=c++20 -c src/remote_accessor.cpp -Iinclude -fsyntax-only

  release:
    name: Publish per-variant release zips
    needs: [build, sanitizers, cross_arch_syntax_check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: bytebinder-*
          merge-multiple: true

      - name: Determine release identity
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_KIND=tag" >> "$GITHUB_ENV"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            echo "RELEASE_KIND=master" >> "$GITHUB_ENV"
            echo "MASTER_TAG=master-${SHORT_SHA}" >> "$GITHUB_ENV"
            echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          fi
          ls -la incoming/

      - name: Publish tagged release
        if: env.RELEASE_KIND == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: incoming/*.zip

      - name: Publish per-commit master release
        if: env.RELEASE_KIND == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.MASTER_TAG }}
          name: Build ${{ env.SHORT_SHA }}
          body: |
            Built from `master` at commit
            [`${{ env.SHORT_SHA }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            One zip per OS × config × link-type variant; each zip contains the
            public headers under `include/` and the built library under `lib/`.
          draft: false
          prerelease: false
          make_latest: true
          files: incoming/*.zip
